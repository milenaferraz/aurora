services:
  aurora-api:
    build:
      context: .
      dockerfile: src/Aurora.Api/Dockerfile

    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      Hermes__BaseUrl: ${HERMES_BASE_URL}
      Hermes__ApiKey: ${HERMES_API_KEY}
      Hermes__Model: ${HERMES_MODEL:-hermes}

      AllowedOrigins__0: ${AURORA_WEB_URL}

    expose:
      - "8080"

    networks:
      - aurora-net

  aurora-web:
    build:
      context: src/aurora-web
      dockerfile: Dockerfile

      args:
        VITE_AURORA_API_URL: ${AURORA_API_URL}

    restart: unless-stopped

    expose:
      - "80"

    depends_on:
      - aurora-api

    networks:
      - aurora-net

networks:
  aurora-net:
    driver: bridge
